[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "veridict"
version = "1.0.0"
description = "Verifiable, Policy-Grounded & Adversarial Decision Intelligence Engine for Regulated Healthcare"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "Veridict Core Team"}
]
dependencies = [
    "pydantic>=2.6.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "rich>=13.7.0",
    "typer>=0.9.0",
    "pytest>=8.0.0"
]

[project.scripts]
veridict = "veridict.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]

